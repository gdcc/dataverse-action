name: Unit Tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Unit Tests
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci --include=dev
      - name: Run Tests
        run: npm test
